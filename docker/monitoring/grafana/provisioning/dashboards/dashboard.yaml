apiVersion: 1

# Keep updateIntervalSeconds at 10 to make grafana watch real time file changes

providers:
  - name: 'network'
    folder: 'Network'
    allowUiUpdates: true
    disableDeletion: true
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards/network

  - name: 'application'
    folder: 'Application'
    allowUiUpdates: true
    disableDeletion: true
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards/application
