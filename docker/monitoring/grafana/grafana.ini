[server]
root_url = ${GRAFANA_ROOT_URL}

[security]
admin_email = ${GRAFANA_ADMIN_EMAIL}
admin_password = $__file{/run/secrets/grafana_password}

[dashboards]
min_refresh_interval = 10s

[auth]
disable_login_form = true
oauth_allow_insecure_email_lookup = true

[auth.generic_oauth]
enabled = true

name = Pocket ID
icon = key-skeleton

scopes = openid profile email
use_pkce = true
auth_style = AutoDetect

auto_login = false
allow_sign_up = false
skip_org_role_sync = true

client_id = ${POCKET_ID_CLIENT_ID}
client_secret = $__file{/run/secrets/pocket_id_secret}

api_url = ${POCKET_ID_API_URL}
auth_url = ${POCKET_ID_AUTH_URL}
token_url = ${POCKET_ID_TOKEN_URL}
