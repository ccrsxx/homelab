services:
  gluetun-slskd:
    image: qmcgaw/gluetun:v3.41.1
    container_name: gluetun-slskd
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TZ=Asia/Jakarta
      - UPDATE_PERIOD=24h
      - UPDATER_VPN_SERVICE_PROVIDERS=protonvpn
      - VPN_TYPE=wireguard
      - VPN_SERVICE_PROVIDER=protonvpn
      - PORT_FORWARD_ONLY=on
      - VPN_PORT_FORWARDING=on
      - SERVER_COUNTRIES=Singapore
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - GLUETUN_HTTP_CONTROL_SERVER_ENABLE=on
      - HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE='{"auth":"apikey","apikey":"${GLUETUN_API_KEY}"}'
    volumes:
      - /docker/appdata/gluetun-slskd:/gluetun
    ports:
      - 5030:5030
      - 8030:8000
    restart: always
    networks:
      - traefik

  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    user: 10000:10000
    environment:
      # General
      - TZ=Asia/Jakarta
      - SLSKD_UMASK=002
      - SLSKD_REMOTE_CONFIGURATION=true

      # VPN
      - SLSKD_VPN=true
      - SLSKD_VPN_PORT_FORWARDING=true
      - SLSKD_VPN_GLUETUN_URL=http://localhost:8000
      - SLSKD_VPN_GLUETUN_API_KEY=${GLUETUN_API_KEY}

      # Web auth
      - SLSKD_USERNAME=${SLSKD_USERNAME}
      - SLSKD_PASSWORD=${SLSKD_PASSWORD}

      # Soulseek account
      - SLSKD_SLSK_USERNAME=${SLSKD_SLSK_USERNAME}
      - SLSKD_SLSK_PASSWORD=${SLSKD_SLSK_PASSWORD}

      # API Key
      - SLSKD_API_KEY=${SLSKD_API_KEY}
    depends_on:
      gluetun-slskd:
        condition: service_healthy
    network_mode: service:gluetun-slskd
    volumes:
      - ./config/slskd:/app
      - /mnt/data/media/music:/music:ro
      - /mnt/data/soulseek/music:/app/downloads
      - /mnt/data/soulseek/incomplete:/app/incomplete
    restart: unless-stopped
    labels:
      - 'traefik.enable=${TRAEFIK_ENABLED:-false}'
      - 'traefik.http.routers.slskd.rule=Host(`slskd.${DOMAIN_MAIN_SECONDARY}`)'
      - 'traefik.http.services.slskd.loadbalancer.server.port=5030'

  soularr:
    image: mrusse08/soularr:latest
    container_name: soularr
    user: 10000:10000
    environment:
      - TZ=Asia/Jakarta
      - SCRIPT_INTERVAL=60
      - SOULARR_SLSKD_API_KEY=${SOULARR_SLSKD_API_KEY}
      - SOULARR_LIDARR_API_KEY=${SOULARR_LIDARR_API_KEY}
    volumes:
      - ./config/soularr:/data
      - /mnt/data/soulseek/music:/downloads
    ports:
      - 8265:8265
    restart: unless-stopped
    depends_on:
      - slskd
    networks:
      - traefik
    labels:
      - 'traefik.enable=${TRAEFIK_ENABLED:-false}'
      - 'traefik.http.routers.soularr.rule=Host(`soularr.${DOMAIN_MAIN_SECONDARY}`)'

networks:
  traefik:
    external: true
