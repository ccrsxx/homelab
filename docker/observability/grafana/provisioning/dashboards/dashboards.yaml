---
apiVersion: 1

providers:
  - name: default
    orgId: 1
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      # Organize dashboards into Grafana folders by directory, so
      # personal-api / homelab / network can be separated later.
      foldersFromFilesStructure: true
