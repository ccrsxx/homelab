services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:v3.2.0
    restart: unless-stopped
    cpus: 2
    volumes:
      - /mnt/docker/appdata/immich:/data
      - /etc/localtime:/etc/localtime:ro
      # --- OpenCloud Storage Pool Mount (Read-Only) ---
      - /mnt/docker/appdata/opencloud/storage/users/users:/mnt/opencloud:ro
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    env_file:
      - .env
    ports:
      - '2283:2283'
    depends_on:
      - redis
      - database
    networks:
      - traefik
      - default
    labels:
      - 'traefik.enable=${TRAEFIK_ENABLED:-false}'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.immich.rule=Host(`immich.${DOMAIN_MAIN_PRIMARY}`)'

  immich-machine-learning:
    container_name: immich_machine_learning
    # Tagged with -openvino for Intel Arc ML inference
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}-openvino
    restart: unless-stopped
    cpus: 2
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    volumes:
      - model-cache:/cache
    env_file:
      - .env

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
    restart: unless-stopped
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - /docker/appdata/immich:/var/lib/postgresql/data
    shm_size: 128mb

volumes:
  model-cache:

networks:
  traefik:
    external: true
