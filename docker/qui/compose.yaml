services:
  qui:
    image: ghcr.io/autobrr/qui:latest
    container_name: qui
    ports:
      - '7476:7476'
    volumes:
      - /docker/appdata/qui:/config
    restart: unless-stopped
    environment:
      - QUI__OIDC_ENABLED=${OIDC_ENABLED:-false}
      - QUI__OIDC_ISSUER=${OIDC_ISSUER}
      - QUI__OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - QUI__OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - QUI__OIDC_REDIRECT_URL=https://qui.${DOMAIN_MAIN_SECONDARY}/api/auth/oidc/callback
      - QUI__OIDC_DISABLE_BUILT_IN_LOGIN=${OIDC_DISABLE_BUILT_IN_LOGIN:-false}
    labels:
      - 'traefik.enable=${TRAEFIK_ENABLED:-false}'
      - 'traefik.http.routers.qui.rule=Host(`qui.${DOMAIN_MAIN_SECONDARY}`)'
    networks:
      - traefik

networks:
  traefik:
    external: true
