services:
  vikunja:
    image: vikunja/vikunja:2.6.0
    environment:
      - VIKUNJA_AUTH_LOCAL_ENABLED=false
      - VIKUNJA_SERVICE_SECRET=${VIKUNJA_SERVICE_SECRET}
      - VIKUNJA_SERVICE_PUBLICURL=https://vikunja.${DOMAIN_MAIN_PRIMARY}
      - VIKUNJA_SERVICE_ENABLEREGISTRATION=false
      - VIKUNJA_DATABASE_HOST=db
      - VIKUNJA_DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - VIKUNJA_DATABASE_TYPE=postgres
      - VIKUNJA_DATABASE_USER=vikunja
      - VIKUNJA_DATABASE_DATABASE=vikunja

      # OICD Setup
      - VIKUNJA_AUTH_OPENID_ENABLED=true
      - VIKUNJA_AUTH_OPENID_PROVIDERS_POCKETID_AUTHURL=${POCKETID_AUTH_URL}
      - VIKUNJA_AUTH_OPENID_PROVIDERS_POCKETID_CLIENTID=${POCKETID_CLIENT_ID}
      - VIKUNJA_AUTH_OPENID_PROVIDERS_POCKETID_CLIENTSECRET=${POCKETID_CLIENT_SECRET}
      - VIKUNJA_AUTH_OPENID_PROVIDERS_POCKETID_NAME=Pocket ID
      - VIKUNJA_AUTH_OPENID_PROVIDERS_POCKETID_SCOPE=openid profile email
      - VIKUNJA_AUTH_OPENID_PROVIDERS_POCKETID_EMAILFALLBACK=true
      - VIKUNJA_AUTH_OPENID_PROVIDERS_POCKETID_USERNAMEFALLBACK=true
    ports:
      - 3456:3456
    volumes:
      - /docker/appdata/vikunja/files:/app/vikunja/files
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: paradedb/paradedb:v0.25.6
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=vikunja
      - POSTGRES_DB=vikunja
    volumes:
      - /docker/appdata/vikunja/db:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U $$POSTGRES_USER']
      interval: 2s
      start_period: 30s
