# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json

sonarr:
  sonarr-anime:
    base_url: !env_var SONARR_ANIME_BASE_URL
    api_key: !env_var SONARR_ANIME_API_KEY

    media_naming:
      series: default
      season: default
      episodes:
        rename: true
        standard: default
        daily: default
        anime: default

    quality_definition:
      type: anime

    # v8 guide-backed profile. The guide renames this profile to
    # "[Anime] Remux-1080p"; we keep the existing v7 name here so Recyclarr
    # adopts the current profile instead of creating a duplicate. Remove `name`
    # after the first successful sync if you want the guide's default name.
    quality_profiles:
      - trash_id: 20e0fc959f1f1704bed501f23bdae76f # [Anime] Remux-1080p
        name: Remux-1080p - Anime
        reset_unmatched_scores:
          enabled: true

    # Your custom score override, preserved from the v7 config. The
    # assign_scores_to name must match the profile name above.
    custom_formats:
      - trash_ids:
          - 026d5aadd1a6b4e550b134cb6c72b3ca # Uncensored
        assign_scores_to:
          - name: Remux-1080p - Anime
            score: 101 # Adjust scoring as desired
