# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json

radarr:
  radarr:
    base_url: !env_var RADARR_BASE_URL
    api_key: !env_var RADARR_API_KEY

    media_naming:
      folder: default
      movie:
        rename: true
        standard: standard

    # Quality definition is now set directly on the instance (v8 no longer uses
    # the radarr-quality-definition-movie include template).
    quality_definition:
      type: movie

    # v8: official include templates were removed. Each guide-backed quality
    # profile below references a single trash_id that pulls its quality profile
    # settings, custom format scores, and CF groups directly from the TRaSH Guides.
    #
    # NOTE: `name` is set to the existing profile name so Recyclarr adopts the
    # profile created by v7 instead of creating a duplicate. Once the first sync
    # succeeds you may remove `name` to adopt the guide's default name.
    quality_profiles:
      # HD Bluray + WEB
      - trash_id: d1d67249d3890e49bc12e275d989a7e9 # HD Bluray + WEB
        name: HD Bluray + WEB
        reset_unmatched_scores:
          enabled: true

      # UHD Bluray + WEB
      - trash_id: 64fb5f9858489bdac2af690e27c8f42f # UHD Bluray + WEB
        name: UHD Bluray + WEB
        reset_unmatched_scores:
          enabled: true

      # Remux + WEB 1080p
      - trash_id: 9ca12ea80aa55ef916e3751f4b874151 # Remux + WEB 1080p
        name: Remux + WEB 1080p
        reset_unmatched_scores:
          enabled: true

      # Remux + WEB 2160p
      - trash_id: fd161a61e3ab826d3a22d53f935696dd # Remux + WEB 2160p
        name: Remux + WEB 2160p
        reset_unmatched_scores:
          enabled: true

    # Non-default CF groups that the official v8 templates opt into. These are
    # NOT auto-synced by guide-backed profiles, so they must be listed here to
    # keep the unwanted-format penalties (BR-DISK, LQ, etc.) that the v7
    # `radarr-custom-formats-*` templates used to provide.
    #
    # Because all four profiles share one instance, the Golden Rule groups are
    # scoped with `assign_scores_to` so the HD and UHD x265 rules only hit the
    # profiles they belong to.
    custom_format_groups:
      add:
        - trash_id: f8bf8eab4617f12dfdbd16303d8da245 # [Optional] Golden Rule HD
          select:
            - dc98083864ea246d05a42df0d05f81cc # x265 (HD)
          assign_scores_to:
            - name: HD Bluray + WEB
            - name: Remux + WEB 1080p

        - trash_id: ff204bbcecdd487d1cefcefdbf0c278d # [Optional] Golden Rule UHD
          select:
            - 839bea857ed2c0a8e084f3cbdbd65ecb # x265 (no HDR/DV)
          assign_scores_to:
            - name: UHD Bluray + WEB
            - name: Remux + WEB 2160p

        # Applies to all four profiles (identical in every official template).
        - trash_id: a3ac6af01d78e4f21fcb75f601ac96df # [Unwanted] Unwanted Formats
          select:
            - b8cd450cbfa689c0259a01d9e29ba3d6 # 3D
            - cae4ca30163749b891686f95532519bd # AV1
            - b6832f586342ef70d9c128d40c07b872 # Bad Dual Groups
            - cc444569854e9de0b084ab2b8b1532b2 # Black and White Editions
            - ed38b889b31be83fda192888e2286d83 # BR-DISK
            - 0a3f082873eb454bde444150b70253cc # Extras
            - e6886871085226c3da1830830146846c # Generated Dynamic HDR
            - 90a6f9a284dff5103f6346090e6280c8 # LQ
            - e204b80c87be9497a8a6eaff48f72905 # LQ (Release Title)
            - 712d74cd88bceb883ee32f773656b1f5 # Sing-Along Versions
            - bfd8eb01832d646a0a89c4deb46f8564 # Upscaled
