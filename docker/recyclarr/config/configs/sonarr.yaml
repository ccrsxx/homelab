# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json

sonarr:
  sonarr:
    base_url: !env_var SONARR_BASE_URL
    api_key: !env_var SONARR_API_KEY

    media_naming:
      series: default
      season: default
      episodes:
        rename: true
        standard: default
        daily: default
        anime: default

    quality_definition:
      type: series

    # v8: official include templates were removed. Guide-backed quality profiles
    # reference a single trash_id that pulls settings, CF scores, and CF groups
    # directly from the TRaSH Guides.
    #
    # NOTE: `name` matches the existing profile name so Recyclarr adopts the
    # profile created by v7 instead of creating a duplicate. Remove `name` after
    # the first successful sync to adopt the guide's default name.
    quality_profiles:
      # WEB-1080p
      - trash_id: 72dae194fc92bf828f32cde7744e51a1 # WEB-1080p
        name: WEB-1080p
        reset_unmatched_scores:
          enabled: true

      # WEB-2160p
      - trash_id: d1498e7d189fbe6c7110ceaabb7473e6 # WEB-2160p
        name: WEB-2160p
        reset_unmatched_scores:
          enabled: true

    # Non-default CF groups that the official v8 templates opt into. These are
    # NOT auto-synced by guide-backed profiles, so they must be listed here to
    # keep the unwanted-format penalties (BR-DISK, LQ, etc.) that the v7
    # `sonarr-v4-custom-formats-*` templates used to provide.
    #
    # The Golden Rule groups are scoped with `assign_scores_to` because both
    # profiles share one instance and the HD/UHD x265 rules differ.
    custom_format_groups:
      add:
        - trash_id: 158188097a58d7687dee647e04af0da3 # [Optional] Golden Rule HD
          select:
            - 47435ece6b99a0b477caf360e79ba0bb # x265 (HD)
          assign_scores_to:
            - name: WEB-1080p

        - trash_id: e3f37512790f00d0e89e54fe5e790d1c # [Optional] Golden Rule UHD
          select:
            - 9b64dff695c2115facf1b6ea59c9bd07 # x265 (no HDR/DV)
          assign_scores_to:
            - name: WEB-2160p

        # Applies to both profiles (identical in both official templates).
        - trash_id: 85fae4a2294965b75710ef2989c850eb # [Streaming Services] HD/UHD boost
          select:
            - 218e93e5702f44a68ad9e3c6ba87d2f0 # HD Streaming Boost
            - 43b3cf48cb385cd3eac608ee6bca7f09 # UHD Streaming Boost

        - trash_id: 59c3af66780d08332fdc64e68297098f # [Unwanted] Unwanted Formats
          select:
            - 15a05bc7c1a36e2b57fd628f8977e2fc # AV1
            - 32b367365729d530ca1c124a0b180c64 # Bad Dual Groups
            - 85c61753df5da1fb2aab6f2a47426b09 # BR-DISK
            - 6f808933a71bd9666531610cb8c059cc # BR-DISK (BTN)
            - fbcb31d8dabd2a319072b84fc0b7249c # Extras
            - 9c11cd3f07101cdba90a2d81cf0e56b4 # LQ
            - e2315f990da2e2cbfc9fa5b7a6fcfe48 # LQ (Release Title)
            - 23297a736ca77c0fc8e70f8edd7ee56c # Upscaled
